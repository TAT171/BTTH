<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài 10 - Trang liên hệ</title>
  <link rel="stylesheet" href="10.css">
</head>
<body>
  <div class="form-card">
    <div class="form-header">
      <h2>Liên hệ với chúng tôi</h2>
      <p>Vui lòng điền thông tin bên dưới, chúng tôi sẽ phản hồi trong 24 giờ.</p>
    </div>

    <form>
      <div class="form-row">
        <div class="form-group">
          <label>Họ và tên</label>
          <input type="text" value="Nguyễn Văn An">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" value="an.nv@tlu.edu.vn">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Số điện thoại</label>
          <input type="text" value="0987 654 321">
        </div>
        <div class="form-group">
          <label>Chủ đề</label>
          <select>
            <option>Hỏi về khoá học</option>
            <option>Hỏi về lịch thi</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Nội dung</label>
        <textarea rows="4">Em muốn hỏi về lịch nộp bài tập môn Lập trình Web ạ.</textarea>
      </div>

      <div class="checkbox-group">
        <div class="checkbox-item">
          <input type="checkbox" id="agree" checked>
        </div>
        <label for="agree" style="font-weight: normal; margin: 0;">Tôi đồng ý nhận email phản hồi.</label>
      </div>

      <div class="btn-group">
        <button type="submit" class="btn-submit">Gửi liên hệ</button>
        <button type="reset" class="btn-reset">Nhập lại</button>
      </div>
    </form>
  </div>
</body>
</html>
