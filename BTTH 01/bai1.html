<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài 1 - Trang thơ Bốn mùa</title>
  <link rel="stylesheet" href="01.css">
</head>
<body>
  <div class="container">
    <h1>BỐN MÙA</h1>
    <div class="kho k1">
      Xuân về hoa nở khắp trời<br>
      Hạ sang nắng cháy rạng ngời phố quen<br>
      Thu về lá rụng bên thềm <br>
    </div>
    <hr class="blue-line">
    <div class="kho k2">
      Đông sang gió lạnh bên em đợi chờ<br>
      Bốn mùa là bốn giấc mơ<br>
      Thời gian đi mãi ta chờ đợi ai<br>
    </div>
    <hr class="blue-line">
    <div class="kho k3">
      Một năm rồi lại một năm<br>
      Vẫn còn câu hát thì thầm quê hương<br>
      Chờ xuân nắng mới soi đường<br>
    </div>
  </div>
</body>
</html>
