<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 16 - Danh sách việc cần làm</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .todo-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 600px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            overflow: hidden;
        }
        .header {
            background-color: #6d28d9;
            color: #ffffff;
            padding: 25px 30px;
        }
        .header h2 {
            font-size: 22px;
            margin-bottom: 6px;
        }
        .header p {
            font-size: 14px;
            opacity: 0.9;
        }
        .body {
            padding: 30px;
        }
        .input-box {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
        }
        .input-box input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }
        .btn-add {
            background-color: #6d28d9;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            font-size: 15px;
        }
        .task-list {
            list-style: none;
            margin-bottom: 25px;
        }
        .task-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 0;
            border-bottom: 1px dashed #ede9fe;
        }
        .task-left {
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            flex: 1;
        }
        .custom-checkbox {
            width: 22px;
            height: 22px;
            border: 2px solid #a78bfa;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .task-item.completed .custom-checkbox {
            background-color: #6d28d9;
            border-color: #6d28d9;
        }
        .custom-checkbox::after {
            content: "✓";
            color: #ffffff;
            font-size: 14px;
            display: none;
        }
        .task-item.completed .custom-checkbox::after {
            display: block;
        }
        .task-text {
            font-size: 15px;
            color: #1f2937;
        }
        .task-item.completed .task-text {
            text-decoration: line-through;
            color: #9ca3af;
        }
        .btn-delete {
            background-color: #fde2e2;
            color: #b91c1c;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
        }
        .footer {
            color: #6b7280;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="todo-card">
    <div class="header">
        <h2>Danh sách việc cần làm</h2>
        <p>Thêm việc mới, đánh dấu hoàn thành hoặc xoá — tất cả bằng JavaScript.</p>
    </div>
    <div class="body">
        <div class="input-box">
            <input type="text" id="inpTask" placeholder="Hoàn thành bài tập Lập trình Web">
            <button class="btn-add" id="btnAdd">Thêm</button>
        </div>

        <ul class="task-list" id="taskList">
            <li class="task-item completed">
                <div class="task-left" onclick="toggleTask(this)">
                    <div class="custom-checkbox"></div>
                    <span class="task-text">Đọc chương HTML5 cơ bản</span>
                </div>
                <button class="btn-delete" onclick="deleteTask(this)">Xoá</button>
            </li>
            <li class="task-item">
                <div class="task-left" onclick="toggleTask(this)">
                    <div class="custom-checkbox"></div>
                    <span class="task-text">Làm bài tập CSS Grid</span>
                </div>
                <button class="btn-delete" onclick="deleteTask(this)">Xoá</button>
            </li>
            <li class="task-item">
                <div class="task-left" onclick="toggleTask(this)">
                    <div class="custom-checkbox"></div>
                    <span class="task-text">Quay video OBS nộp bài</span>
                </div>
                <button class="btn-delete" onclick="deleteTask(this)">Xoá</button>
            </li>
        </ul>

        <div class="footer" id="countFooter">
            Còn 2 việc chưa hoàn thành
        </div>
    </div>
</div>

<script>
    const inpTask = document.getElementById('inpTask');
    const btnAdd = document.getElementById('btnAdd');
    const taskList = document.getElementById('taskList');
    const countFooter = document.getElementById('countFooter');

    function updateCounter() {
        const totalItems = taskList.querySelectorAll('.task-item');
        const completedItems = taskList.querySelectorAll('.task-item.completed');
        const remaining = totalItems.length - completedItems.length;
        countFooter.textContent = `Còn ${remaining} việc chưa hoàn thành`;
    }

    function toggleTask(elem) {
        const li = elem.closest('.task-item');
        li.classList.toggle('completed');
        updateCounter();
    }

    function deleteTask(btn) {
        const li = btn.closest('.task-item');
        li.remove();
        updateCounter();
    }

    btnAdd.addEventListener('click', () => {
        const text = inpTask.value.trim();
        if (text === "") return;

        const li = document.createElement('li');
        li.className = 'task-item';
        li.innerHTML = `
            <div class="task-left" onclick="toggleTask(this)">
                <div class="custom-checkbox"></div>
                <span class="task-text">${text}</span>
            </div>
            <button class="btn-delete" onclick="deleteTask(this)">Xoá</button>
        `;

        taskList.appendChild(li);
        inpTask.value = "";
        updateCounter();
    });

    updateCounter();
</script>

</body>
</html>
