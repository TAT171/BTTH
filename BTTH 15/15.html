<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 15 - Máy tính đơn giản</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .calculator {
            background-color: #111827;
            width: 100%;
            max-width: 360px;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }
        .display {
            background-color: #022c22;
            border-radius: 10px;
            padding: 15px;
            text-align: right;
            margin-bottom: 20px;
            min-height: 90px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .expression {
            color: #86efac;
            font-size: 16px;
            min-height: 20px;
            word-break: break-all;
        }
        .result {
            color: #4ade80;
            font-size: 36px;
            font-weight: bold;
            word-break: break-all;
        }
        .keypad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        .btn {
            background-color: #25313f;
            color: #e5e7eb;
            border: none;
            border-radius: 10px;
            height: 55px;
            font-size: 20px;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.15s;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .btn:active {
            opacity: 0.8;
        }
        .btn-clear {
            background-color: #dc2626;
            color: #ffffff;
        }
        .btn-op {
            background-color: #0d6efd;
            color: #ffffff;
        }
        .btn-equal {
            background-color: #16a34a;
            color: #ffffff;
        }
        .btn-zero {
            grid-column: span 2;
        }
    </style>
</head>
<body>

<div class="calculator">
    <div class="display">
        <div class="expression" id="expr">12 + 8 × 3</div>
        <div class="result" id="res">36</div>
    </div>
    <div class="keypad">
        <button class="btn btn-clear" onclick="clearAll()">C</button>
        <button class="btn btn-op" onclick="appendOp('()')">()</button>
        <button class="btn btn-op" onclick="appendOp('%')">%</button>
        <button class="btn btn-op" onclick="appendOp('÷')">÷</button>

        <button class="btn" onclick="appendNum('7')">7</button>
        <button class="btn" onclick="appendNum('8')">8</button>
        <button class="btn" onclick="appendNum('9')">9</button>
        <button class="btn btn-op" onclick="appendOp('×')">×</button>

        <button class="btn" onclick="appendNum('4')">4</button>
        <button class="btn" onclick="appendNum('5')">5</button>
        <button class="btn" onclick="appendNum('6')">6</button>
        <button class="btn btn-op" onclick="appendOp('-')">-</button>

        <button class="btn" onclick="appendNum('1')">1</button>
        <button class="btn" onclick="appendNum('2')">2</button>
        <button class="btn" onclick="appendNum('3')">3</button>
        <button class="btn btn-op" onclick="appendOp('+')">+</button>

        <button class="btn btn-zero" onclick="appendNum('0')">0</button>
        <button class="btn" onclick="appendNum('.')">.</button>
        <button class="btn btn-equal" onclick="calculate()">=</button>
    </div>
</div>

<script>
    let exprElem = document.getElementById('expr');
    let resElem = document.getElementById('res');
    let currentExpr = "12 + 8 × 3";
    let bracketOpen = false;

    function updateDisplay() {
        exprElem.textContent = currentExpr;
    }

    function clearAll() {
        currentExpr = "";
        exprElem.textContent = "";
        resElem.textContent = "0";
        bracketOpen = false;
    }

    function appendNum(num) {
        currentExpr += num;
        updateDisplay();
    }

    function appendOp(op) {
        if (op === '()') {
            if (!bracketOpen) {
                currentExpr += "(";
                bracketOpen = true;
            } else {
                currentExpr += ")";
                bracketOpen = false;
            }
        } else {
            currentExpr += ` ${op} `;
        }
        updateDisplay();
    }

    function calculate() {
        try {
            let evalStr = currentExpr
                .replace(/×/g, '*')
                .replace(/÷/g, '/');
            
            let ans = eval(evalStr);
            resElem.textContent = ans;
        } catch (e) {
            resElem.textContent = "Lỗi";
        }
    }
</script>

</body>
</html>
