<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài 23 - Thư viện ảnh Hover</title>
    <style>
        body { 
            font-family: sans-serif; 
            background: #f8f9fa; 
            text-align: center; 
            padding: 40px 20px;
         }
        h1 { 
            margin-bottom: 5px; 
        }
        p.subtitle { 
            color: #666; 
            margin-bottom: 30px; 
        }
        
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            max-width: 1000px;
            margin: auto;
        }
        
        .card {
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            transition: transform 0.4s ease;
            display: block;
        }
        
        .card:hover img {
            transform: scale(1.12);
        }
        
        .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 40px 15px 15px;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            color: white;
            text-align: left;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none; /* Tránh cản trở hover */
        }
        
        .card:hover .overlay {
            opacity: 1;
        }
        
    </style>
</head>
<body>
    <h1>Thư viện ảnh — Hiệu ứng Hover</h1>
    <p class="subtitle">Rê chuột lên ảnh để thấy hiệu ứng phóng to (zoom) và lớp phủ chú thích.</p>
    
    <div class="gallery-grid">
        <div class="card">
            <img src="1-vinh-ha-long.jpg" alt="Vịnh Hạ Long">
            <div class="overlay">Vịnh Hạ Long</div>
        </div>
        <div class="card">
            <img src="2-son-doong.jpg" alt="Hang Sơn Đoòng">
            <div class="overlay">Hang Sơn Đoòng</div>
        </div>
        <div class="card">
            <img src="3-thac-ban-gioc.jpg" alt="Thác Bản Giốc">
            <div class="overlay">Thác Bản Giốc</div>
        </div>
        <div class="card">
            <img src="4-fansipan.jpg" alt="Fansipan">
            <div class="overlay">Fansipan</div>
        </div>
        <div class="card">
            <img src="5-mekong.jpg" alt="Đồng bằng sông Cửu Long">
            <div class="overlay">Đồng bằng sông Cửu Long</div>
        </div>
        <div class="card">
            <img src="6-phong-nha.jpg" alt="Động Phong Nha">
            <div class="overlay">Động Phong Nha</div>
        </div>
    </div>
</body>
</html>
